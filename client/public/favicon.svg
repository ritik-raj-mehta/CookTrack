<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ctBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ctAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="ctShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#ctBg)" />
  <rect x="10" y="10" width="492" height="492" rx="120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="10" />

  <!-- Chef Hat Icon -->
  <g filter="url(#ctShadow)">
    <!-- Base Headband -->
    <rect x="180" y="340" width="152" height="52" rx="14" fill="#ffffff" />
    <!-- Golden Accent Stripe on Band -->
    <rect x="194" y="356" width="124" height="12" rx="6" fill="url(#ctAccent)" />

    <!-- Hat Cloud Body -->
    <path
      d="M184 340 C146 340 120 312 120 278 C120 248 142 226 168 220 C162 208 160 196 160 184 C160 138 198 108 244 108 C252 108 260 110 268 114 C278 110 288 108 298 108 C342 108 376 138 376 182 C376 195 372 208 366 220 C392 226 412 248 412 278 C412 312 386 340 348 340 Z"
      fill="#ffffff"
    />

    <!-- Interior Folds -->
    <path d="M216 164 C204 210 204 274 216 340" stroke="#e5e7eb" stroke-width="12" stroke-linecap="round" />
    <path d="M268 136 C264 200 264 274 266 340" stroke="#e5e7eb" stroke-width="12" stroke-linecap="round" />
    <path d="M316 164 C328 210 328 274 316 340" stroke="#e5e7eb" stroke-width="12" stroke-linecap="round" />

    <!-- Kitchen Sparkle (Gold Star) -->
    <polygon
      points="396,96 402,118 424,124 402,130 396,152 390,130 368,124 390,118"
      fill="url(#ctAccent)"
    />
  </g>
</svg>

